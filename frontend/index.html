<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>知识图谱问答系统</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f1117;color:#e1e4e8}
.header{background:linear-gradient(135deg,#1a1f36,#2d1b69);padding:20px 30px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px;color:#a78bfa}
.stats{display:flex;gap:20px;font-size:13px;color:#8b8fa3}
.stats span{background:#1e2235;padding:5px 12px;border-radius:15px}
.container{display:flex;height:calc(100vh - 70px)}
.left{flex:1;display:flex;flex-direction:column;border-right:1px solid #2a2d3e}
.right{flex:1}
.chat{flex:1;overflow-y:auto;padding:20px}
.msg{margin-bottom:15px;max-width:85%}
.msg.user{margin-left:auto}
.bubble{padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6}
.msg.user .bubble{background:#6366f1;color:#fff;border-bottom-right-radius:4px}
.msg.bot .bubble{background:#1e2235;border:1px solid #2a2d3e;border-bottom-left-radius:4px}
.ctx{margin-top:8px;padding:8px 12px;background:#161926;border-radius:8px;font-size:12px;color:#8b8fa3}
.input-area{padding:15px 20px;border-top:1px solid #2a2d3e;display:flex;gap:10px}
.input-area input{flex:1;background:#1e2235;border:1px solid #2a2d3e;color:#e1e4e8;padding:12px 16px;border-radius:10px;font-size:14px;outline:none}
.input-area input:focus{border-color:#6366f1}
.btn{padding:12px 20px;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
.btn-primary{background:#6366f1;color:#fff}
.btn-secondary{background:#1e2235;color:#a78bfa;border:1px solid #2a2d3e}
.tabs{display:flex;gap:5px;padding:10px 20px;border-bottom:1px solid #2a2d3e}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;color:#8b8fa3;background:transparent;border:none}
.tab.active{background:#6366f1;color:#fff}
#graph-container{width:100%;height:100%}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;justify-content:center;align-items:center}
.modal.show{display:flex}
.modal-content{background:#1a1f36;padding:25px;border-radius:16px;width:500px}
.modal-content h3{margin-bottom:15px;color:#a78bfa}
.modal-content input{width:100%;background:#0f1117;border:1px solid #2a2d3e;color:#e1e4e8;padding:10px;border-radius:8px;margin-bottom:10px;font-size:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:15px}
.loading{display:inline-block;width:20px;height:20px;border:2px solid #6366f1;border-radius:50%;border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="header">
<h1>🧠 知识图谱问答系统</h1>
<div class="stats"><span>实体:<b id="nc">0</b></span><span>关系:<b id="ec">0</b></span></div>
</div>
<div class="container">
<div class="left">
<div class="tabs">
<button class="tab active" onclick="switchTab('chat')">💬 问答</button>
<button class="tab" onclick="switchTab('ingest')">📥 导入</button>
<button class="tab" onclick="showTriple()">➕ 添加三元组</button>
</div>
<div class="chat" id="chat">
<div class="msg bot"><div class="bubble">你好！我是知识图谱问答助手。你可以向我提问，或导入文本构建知识图谱。</div></div>
</div>
<div id="ingest-panel" style="display:none;padding:20px;flex:1">
<h3 style="margin-bottom:10px;color:#a78bfa">导入文本知识</h3>
<textarea id="ingest-text" rows="10" style="width:100%;background:#0f1117;border:1px solid #2a2d3e;color:#e1e4e8;padding:12px;border-radius:8px;font-size:14px" placeholder="粘贴文本内容..."></textarea>
<div style="margin-top:10px;display:flex;gap:10px">
<button class="btn btn-primary" onclick="ingestText()">开始抽取</button>
<span id="ingest-status" style="color:#8b8fa3;font-size:13px;line-height:40px"></span>
</div>
</div>
<div class="input-area" id="chat-input">
<input id="question" placeholder="输入问题..." onkeydown="if(event.key==='Enter')askQ()">
<button class="btn btn-primary" onclick="askQ()">提问</button>
</div>
</div>
<div class="right"><div id="graph-container"></div></div>
</div>
<div class="modal" id="triple-modal">
<div class="modal-content">
<h3>手动添加三元组</h3>
<input id="ts" placeholder="主语"><input id="tr" placeholder="关系"><input id="to" placeholder="宾语">
<div class="modal-actions">
<button class="btn btn-secondary" onclick="closeModal()">取消</button>
<button class="btn btn-primary" onclick="addTriple()">添加</button>
</div>
</div>
</div>
<script>
let network=null;
async function loadGraph(){
try{const r=await fetch('/graph');const d=(await r.json()).data;
if(!d.nodes.length)return;
const c=document.getElementById('graph-container');
const nodes=new vis.DataSet(d.nodes.map(n=>({...n,color:'#6366f1',font:{color:'#e1e4e8',size:13},shape:'dot',size:20})));
const edges=new vis.DataSet(d.edges.map(e=>({...e,color:{color:'#4a4d5e',highlight:'#6366f1'},font:{color:'#8b8fa3',size:10},smooth:{type:'curvedCW',roundness:.2}})));
if(network)network.destroy();
network=new vis.Network(c,{nodes,edges},{physics:{stabilization:{iterations:100},barnesHut:{gravitationalConstant:-3000}},interaction:{hover:true}});
}catch(e){console.error(e)}}
async function loadStats(){try{const r=await fetch('/stats');const d=(await r.json()).data;document.getElementById('nc').textContent=d.nodes;document.getElementById('ec').textContent=d.edges}catch(e){}}
function addMsg(role,text,ctx){
const a=document.getElementById('chat'),div=document.createElement('div');div.className='msg '+role;
let ch='';if(ctx&&ctx.length)ch='<div class="ctx">图谱依据: '+ctx.map(c=>c.source+' → '+c.target+' ['+c.relation+']').join(' | ')+'</div>';
div.innerHTML='<div class="bubble">'+text+'</div>'+ch;a.appendChild(div);a.scrollTop=a.scrollHeight;}
async function askQ(){
const inp=document.getElementById('question'),q=inp.value.trim();if(!q)return;inp.value='';addMsg('user',q);
const ld=document.createElement('div');ld.className='msg bot';ld.innerHTML='<div class="bubble"><span class="loading"></span> 思考中...</div>';
document.getElementById('chat').appendChild(ld);
try{const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
const j=await r.json();ld.remove();addMsg('bot',j.data.answer,j.data.context)}catch(e){ld.remove();addMsg('bot','请求失败')}}
async function ingestText(){
const text=document.getElementById('ingest-text').value.trim();if(!text)return;
const s=document.getElementById('ingest-status');s.textContent='正在抽取...';
try{const r=await fetch('/ingest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
const j=await r.json();s.textContent=`完成! ${j.data.triples_unique}个三元组`;loadGraph();loadStats()}catch(e){s.textContent='失败'}}
function switchTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));event.target.classList.add('active');
document.getElementById('chat').style.display=t==='chat'?'block':'none';
document.getElementById('chat-input').style.display=t==='chat'?'flex':'none';
document.getElementById('ingest-panel').style.display=t==='ingest'?'block':'none'}
function showTriple(){document.getElementById('triple-modal').classList.add('show')}
function closeModal(){document.getElementById('triple-modal').classList.remove('show')}
async function addTriple(){
const s=document.getElementById('ts').value.trim(),r=document.getElementById('tr').value.trim(),o=document.getElementById('to').value.trim();
if(!s||!r||!o)return;
await fetch('/triple',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:s,relation:r,object:o})});
closeModal();loadGraph();loadStats()}
loadGraph();loadStats();
</script>
</body>
</html>
